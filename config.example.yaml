# Copy to `config.yaml` and edit. Environment variables (LOCAL_AGENT_*) override these.
# Never put API keys in this file — they belong in `.env` or the environment.

provider: ollama                       # gemini | ollama | mock
model: null                            # optional override for the provider's own model setting

workspace: ./workspace                 # hard filesystem boundary for every file tool
data_dir: ~/.local-agent               # SQLite database and JSONL logs

# Both accept an absolute path, on any drive:
#   data_dir: D:/Agent/data             # forward slashes work on Windows too
#   data_dir: 'D:\Agent\data'           # backslashes need SINGLE quotes
# Do NOT use double quotes around a backslash path — YAML reads \A as an escape
# sequence and the file fails to parse.

# --- Provider settings ----------------------------------------------------
gemini_model: gemini-2.5-flash
gemini_timeout_seconds: 120

ollama_base_url: http://localhost:11434
ollama_model: llama3.1
ollama_timeout_seconds: 120

# --- Approvals ------------------------------------------------------------
approval_mode: risky                   # always | risky | automatic
auto_approve_tools: []                 # only consulted in `automatic` mode

# --- Limits ---------------------------------------------------------------
max_steps: 20
max_tool_calls_per_step: 4
max_total_tool_calls: 40
max_retries_per_action: 2
provider_timeout_seconds: 120
tool_timeout_seconds: 30
max_file_bytes: 1000000
max_tool_output_chars: 12000
max_model_output_tokens: 4096
max_conversation_messages: 200
max_persisted_facts: 500
max_search_results: 100

# --- Shell policy ---------------------------------------------------------
# Deny-by-default: only these program names may be executed, and only after approval.
#
# These are Unix tool names. On WINDOWS most of them do not exist, and `run_shell`
# will report "allowlisted but not installed" rather than doing anything. Replace
# the list with programs you actually have, for example:
#
#   shell_allowed_commands:
#     - git
#     - python          # `python3` is not a Windows executable name
#     - pytest
#     - findstr         # the Windows equivalent of grep
#     - where           # the Windows equivalent of which
#
# Or set `shell_enabled: false` below to remove the capability entirely.
shell_allowed_commands:
  - ls
  - cat
  - head
  - tail
  - wc
  - echo
  - pwd
  - grep
  - find
  - python3
  - pytest
  - git

# Set to false to remove shell execution entirely, rather than relying on the
# allowlist alone. Recommended on Windows if you do not need it.
shell_enabled: true

# --- Media (images, audio, video) -----------------------------------------
media:
  max_image_bytes: 8000000
  max_audio_bytes: 25000000
  max_video_bytes: 50000000
  max_attachments_per_message: 4
  # Video is off by default: large, costly, and unsupported by most local
  # models. Turning it on does not make an incapable provider accept it.
  enable_video: false

# --- Connectors (MCP servers) ---------------------------------------------
# Master switch. Individual connectors live in <data_dir>/connectors.json and
# are managed with `local-agent connectors ...`, not edited here.
connectors_enabled: true

# --- Logging --------------------------------------------------------------
log_level: INFO
verbose_tool_logging: false            # opt-in debug detail; still redacted
